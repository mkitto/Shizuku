name: App

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/ISSUE_TEMPLATE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
          ./gradlew :manager:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: svcmgr-apk
          path: manager/build/outputs/apk/release/*.apk
          compression-level: 9
      - name: Create Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK=$(ls manager/build/outputs/apk/release/*.apk | head -n 1)
          VERSION=$(basename "$APK" | sed -E 's/^svcmgr-v(.+)-release\.apk$/\1/')
          ASSET="SvcMgr-v${VERSION}-com.nq4w7z.k2mv8p.apk"
          TAG="svcmgr-${VERSION}"
          cp "$APK" "$ASSET"
          NOTES="Personal build of Shizuku Manager (package com.nq4w7z.k2mv8p), built automatically from mkitto/Shizuku at ${GITHUB_SHA}.
          Fixed signing key, so newer builds install directly over older ones (same signature).
          Based on RikkaApps/Shizuku, Apache-2.0. Not affiliated with the upstream project.
          Install note: uninstall the official Shizuku first; after first launch, activate via ADB wireless debugging pairing."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" --repo "$GITHUB_REPOSITORY" --target "${GITHUB_SHA}" --title "SvcMgr v${VERSION} (personal build)" --notes "$NOTES"
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
