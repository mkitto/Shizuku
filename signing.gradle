def ksFile = rootProject.file('signing.properties')
def props = new Properties()
if (ksFile.canRead()) {
    props.load(new FileInputStream(ksFile))

    if (props != null) {
        android.signingConfigs.sign.storeFile file(props['KEYSTORE_FILE'])
        android.signingConfigs.sign.storePassword props['KEYSTORE_PASSWORD']
        android.signingConfigs.sign.keyAlias props['KEYSTORE_ALIAS']
        android.signingConfigs.sign.keyPassword props['KEYSTORE_ALIAS_PASSWORD']
    }
} else {
    // Fallback: keystore committed in this repo so that every CI build produces
    // APKs signed with the same key (stable, over-installable updates).
    android.signingConfigs.sign.storeFile rootProject.file('keystore/svcmgr.p12')
    android.signingConfigs.sign.storeType 'pkcs12'
    android.signingConfigs.sign.storePassword 'svcmgr2026'
    android.signingConfigs.sign.keyAlias 'svcmgr'
    android.signingConfigs.sign.keyPassword 'svcmgr2026'
}
